embeddings:
  embedding_model_name: "google/embeddinggemma-300m"
  chunk_size: 512
  docs_path: "data/ceo-docs"
  vectorstore_path: "data/vectorstores/ceo_docs_faiss"
  vectorstore_gcs: "ceo-docs-faiss"

llm:
  prompt_file: "conf/base/prompts.yml"
  models:
    gemini:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-2.5-flash
      api_key_env: GEMINI_API_KEY
      context_window: 1000000
      max_output_tokens: 8192
      temperature: 0.2
      timeout: 60
      fallback: [gemini-2.0-flash]   # fallback names reuse this entry's base_url and api_key_env
    deepseek-flash:
      base_url: https://api.deepseek.com
      model: deepseek-flash
      api_key_env: DEEPSEEK_API_KEY
      context_window: 1000000
      max_output_tokens: 8192
      json_mode: true          # JSON output mode for the interpreter
    anthropic:
      base_url: https://api.anthropic.com/v1/
      model: claude-sonnet-5-5
      api_key_env: ANTHROPIC_API_KEY
      context_window: 1000000
      max_output_tokens: 8192
    openai:
      base_url: https://api.openai.com/v1
      model: gpt-6.1-sol
      api_key_env: OPENAI_API_KEY
      context_window: 1050000
      max_output_tokens: 8192
      json_mode: true          # JSON output mode for the interpreter
    kimi:
      base_url: https://api.moonshot.ai/v1
      model: kimi-k3.1-pro
      api_key_env: MOONSHOT_API_KEY
      context_window: 1048576
      max_output_tokens: 8192
      json_mode: true          # JSON output mode for the interpreter
    local:
      # base_url: http://localhost:11434/v1
      base_url: http://inference:11434/v1
      model: llama3.1:8b-instruct-q4_K_M
      context_window: 131072
      probe: true              # liveness check at startup
      json_mode: true          # JSON output mode for the interpreter
      # no api_key_env - keyless (Ollama ignores the key)
  active_model: local

github:
  repo_url: "https://github.com/openforis/collect-earth-online-doc.git"
  ref: "main"
  path: "docs/source"