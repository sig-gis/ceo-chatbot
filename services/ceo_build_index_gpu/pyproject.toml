[project]
name = "ceo-build-index-gpu"
version = "0.1.0"
description = "GPU-accelerated variant of ceo-build-index. Uses faiss-gpu-cu12 and the CUDA-enabled torch wheel."
readme = "README.md"
authors = [
    { name = "Arif Syraj", email = "126988341+arif-syr@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "faiss-gpu-cu12",
    "langchain-core",
    "langchain-community",
    "langchain-huggingface",
    "langchain-text-splitters",
    "transformers",
    "sentence-transformers",
    "torch",
    "unstructured[rst]",
    "ceo-chatbot-core"
]

# torch deliberately has no [tool.uv.sources] override here. The repo is one uv
# workspace with a single uv.lock, and ceo-build-index pins torch to the CPU
# wheel index; uv resolves one torch build for all members, so adding a CUDA
# source here would be a workspace source conflict. Instead, the Docker image
# reinstalls the CUDA torch build from an explicit PyTorch index after `uv sync`
# (see TORCH_CUDA_INDEX in the Dockerfile).
#
# Consequence: this package only works from its Docker image. `uv run
# build-index-gpu` from the shared workspace venv installs the CPU torch from
# the lockfile, so `--device cuda` fails with "Torch not compiled with CUDA".

[tool.uv.sources]
ceo_chatbot_core = {workspace = true}

[project.scripts]
build-index-gpu = "ceo_build_index_gpu.main:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
